[package]
name = "bullet-runner-core"
description = "Attempt runner loop: lease, private clone via bullet-gitd, provider session, scope check, apply, gate, candidate."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
# Exposes the self-minting in-process lease simulator and propagates the
# application issuer seam. Never enable in a production Runner build.
test-seams = ["bullet-application/test-seams"]

[dependencies]
async-trait.workspace = true
bullet-application.workspace = true
bullet-domain.workspace = true
bullet-harness-core.workspace = true
chrono.workspace = true
futures.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
rustix.workspace = true
tempfile.workspace = true

[dev-dependencies]
bullet-harness-sim.workspace = true

[[test]]
name = "signed_lease"
required-features = ["test-seams"]
