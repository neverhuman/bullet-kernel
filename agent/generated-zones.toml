# Generated and reviewed-manual contract zones.
#
# Every zone declares a non-empty `path`, `source` and `command` so a repair is
# reproducible without reading CI. `write_policy = "generator_only"` means the
# file is regenerated and must never be hand-edited;
# `write_policy = "reviewed_manual"` means the file is authored by hand, stays
# fully audit-visible, and carries a named proof that keeps it honest.

[[zone]]
path = "contracts/generated/"
source = "contracts/openapi.yaml"
command = "bash ops/ci/contract.sh"
owner = "contracts"
read_only = true
write_policy = "generator_only"

[[zone]]
path = "crates/domain/src/schema_bundle.rs"
source = "bullet-farm:contracts/generated/rust/schema_bundle.rs"
command = "bash ../bullet-farm/scripts/sync-family-contracts.sh"
owner = "contracts"
read_only = true
write_policy = "generator_only"

[[zone]]
path = "crates/application/tests/fixtures/policy-v1alpha1.json"
source = "bullet-farm:policy/v1alpha1/policy.json"
command = "bash ../bullet-farm/scripts/sync-family-contracts.sh"
owner = "application"
read_only = true
write_policy = "generator_only"

[[zone]]
path = "crates/application/tests/fixtures/policy-v1alpha2-live-enabled.json"
source = "bullet-farm:crates/bullet-wire/tests/fixtures/policy-v1alpha2-live-enabled.json"
command = "bash ../bullet-farm/scripts/sync-family-contracts.sh"
owner = "application"
read_only = true
write_policy = "generator_only"

[[zone]]
path = "crates/adapters/tests/fixtures/formal/"
source = "bullet-farm:formal/traces"
command = "bash ../bullet-farm/scripts/sync-family-contracts.sh"
owner = "assurance"
read_only = true
write_policy = "generator_only"

# NOT declared as a zone: `contracts/schemas/patch-proposal.json` is a
# hand-written JSON Schema with no generator, and declaring it here would be a
# claim that it is generated. The auditor reports it as HLT-007-HANDWRITTEN-
# CONTRACT and that report is correct. What keeps it honest today is a real
# test, not a manifest entry: `crates/harness-core/src/proposal.rs` embeds the
# exact bytes through `schema_source()`, and
# `schema_and_authoritative_struct_agree` fails if the schema and the
# authoritative Rust struct drift apart. Change the schema and the struct
# together, with that test green.
#
# (Declaring it with `write_policy = "reviewed_manual"` was tried and reverted:
# jankurai 1.6.11 does not honour `reviewed_manual` in its generated-header
# check -- proved with a two-file scratch repository, identical finding with and
# without the key -- so the declaration only replaced a true finding with a false
# instruction to add a `DO NOT EDIT` header to a hand-authored file.)
