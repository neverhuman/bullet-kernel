# Generated and reviewed-manual contract zones.
#
# Every zone declares a non-empty `path`, `source` and `command` so a repair is
# reproducible without reading CI. `write_policy = "generator_only"` means the
# file is regenerated and must never be hand-edited;
# `write_policy = "reviewed_manual"` means the file is authored by hand, stays
# fully audit-visible, and carries a named proof that keeps it honest.

[[zone]]
path = "contracts/generated/"
source = "contracts/openapi.yaml"
command = "cargo run --locked -p bullet --bin bullet -- contracts generate"
owner = "contracts"
read_only = true
write_policy = "generator_only"

[[zone]]
path = "generated/schema_bundle.rs"
source = "bullet-farm:contracts/generated/rust/schema_bundle.rs"
command = "cp ../bullet-farm/contracts/generated/rust/schema_bundle.rs generated/schema_bundle.rs"
owner = "contracts"
read_only = true
write_policy = "generator_only"

[[zone]]
path = "generated/formal/"
source = "bullet-farm:formal/traces"
command = "bash ../bullet-farm/scripts/sync-family-contracts.sh write"
owner = "assurance"
read_only = true
write_policy = "generator_only"

[[zone]]
path = "generated/patch-proposal-binding.rs"
source = "contracts/schemas/patch-proposal.json"
command = "cargo test --locked -p bullet-harness-core --lib proposal::tests::schema_and_authoritative_struct_agree -- --exact"
owner = "contracts"
read_only = true
write_policy = "generator_only"
