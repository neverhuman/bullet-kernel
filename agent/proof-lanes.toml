# Canonical Kernel proof-lane registry. Every accepted `scripts/ci-local.sh`
# name has one record, including compatibility aliases. Each purpose begins
# with validator-bound execution facts. No entry is release authority.

[[lane]]
name = "required"
command = "bash scripts/ci-local.sh required"
purpose = "scope=standalone; scheduled=false; hosted_required=false; jeryu=prepared-inactive; release_authority=false; release_state=BLOCKED; local sequential convergence; hosted CI converges atomic observations instead"
command_id = "lane.required"
kind = "validation"
cost = 50
rules_covered = ["HLT-004-UNMAPPED-PROOF", "HLT-008-FALSE-GREEN-RISK", "HLT-009-GENERATED-SECURITY", "HLT-010-SECRET-SPRAWL", "HLT-016-SUPPLY-CHAIN-DRIFT", "HLT-020-CI-HARDENING-GAP"]
required_artifacts = [".ci-artifacts/junit/fast.xml", ".ci-artifacts/junit/contract.xml"]
timeout_seconds = 3600
requires_network = true
destructive = false

