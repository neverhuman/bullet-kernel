[package]
name = "bullet-farmd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Off by default: the daemon then compiles no static assets, mounts no static
# route, and needs no Node toolchain. On, `build.rs` requires
# BULLET_PORTAL_DIST to name an absolute, already-built bullet-portal dist/
# and embeds it only after verifying every byte against that dist's own
# .bullet-portal-bundle-v1.json manifest.
[features]
embedded-portal = []
# Compiles the debug-only synthetic selected-Variant UDS seam. Never default.
test-seams = ["bullet-application/test-seams"]

[dependencies]
axum.workspace = true
bullet-adapters.workspace = true
bullet-application.workspace = true
bullet-domain.workspace = true
bullet-harness-core.workspace = true
chrono.workspace = true
clap.workspace = true
futures-util.workspace = true
getrandom.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["net"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
blake3.workspace = true
libc.workspace = true
serde_json.workspace = true

[dev-dependencies]
blake3.workspace = true
bullet-runner-core = { workspace = true, features = ["test-seams"] }
rusqlite.workspace = true
tempfile.workspace = true
