[package]
name = "bullet"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
synthetic-dogfood = ["bullet-application/test-seams", "bullet-runner-core/test-seams"]

[dependencies]
bullet-adapters.workspace = true
bullet-application = { workspace = true, features = ["dogfood-claude"] }
bullet-domain.workspace = true
bullet-effects-core.workspace = true
bullet-harness-antigravity.workspace = true
bullet-harness-claude.workspace = true
bullet-harness-codex.workspace = true
bullet-harness-core.workspace = true
bullet-harness-cursor.workspace = true
bullet-harness-egress.workspace = true
bullet-harness-sim.workspace = true
bullet-runner-core.workspace = true
bullet-verifier-core.workspace = true
chrono.workspace = true
clap.workspace = true
futures.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
rustix = { workspace = true, features = ["pty", "termios"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json"] }
crossterm = "=0.29.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
jsonschema = { version = "=0.49.9", default-features = false }
tempfile.workspace = true
tokio.workspace = true

[dev-dependencies]
axum.workspace = true
bullet-farmd.workspace = true
vt100 = "=0.16.2"
