[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.fast]
slow-timeout = { period = "20s", terminate-after = 2 }
fail-fast = true

[profile.fast.junit]
path = "junit.xml"

[profile.contract]
slow-timeout = { period = "45s", terminate-after = 2 }
fail-fast = false
test-threads = "num-cpus"

[profile.contract.junit]
path = "junit.xml"

[profile.family]
slow-timeout = { period = "45s", terminate-after = 2 }
fail-fast = false
test-threads = 1

[profile.family.junit]
path = "junit.xml"

[profile.coverage]
slow-timeout = { period = "120s", terminate-after = 2 }
fail-fast = false
test-threads = "num-cpus"
