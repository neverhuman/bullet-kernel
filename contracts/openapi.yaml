openapi: 3.1.0
info:
  title: Bullet Farm Control Plane
  version: 0.1.0
  description: Projection API. The portal is never an authority source.
servers:
  - url: http://127.0.0.1:7420
paths:
  /health:
    get:
      summary: Liveness
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /openapi.yaml:
    get:
      summary: This contract
      responses:
        "200":
          description: OpenAPI document
  /v1/missions:
    get:
      summary: List missions
      responses:
        "200":
          description: missions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mission"
        "500":
          description: store failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/missions/{id}:
    get:
      summary: Mission graph projection
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: mission view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionView"
        "400":
          description: invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/demo:
    get:
      summary: Demo receipt re-derived from ledger rows, or null before a run
      responses:
        "200":
          description: receipt or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DemoReceipt"
                  - type: "null"
  /v1/demo/run:
    post:
      summary: Run the simulator demonstration
      responses:
        "200":
          description: DemoReceipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoReceipt"
  /v1/outbox:
    get:
      summary: Outbox rows with real delivery phases
      responses:
        "200":
          description: outbox rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxView"
  /v1/events:
    get:
      summary: Server-sent event stream of ledger events
      description: >
        Emits one SSE frame per ledger event with the ledger sequence as the
        SSE id, the event kind as the SSE event name, and the Event JSON as
        data. Poll-backed; resume with `after`.
      parameters:
        - in: query
          name: after
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: text/event-stream of Event frames
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/Event"
  /v1/leases/acquire:
    post:
      summary: Acquire the writer lease for one work package (spec 26.3)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseAcquireRequest"
      responses:
        "200":
          description: fenced attempt plus authority token and lease row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseAcquireResponse"
        "400":
          description: invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: unknown work package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: refused (already leased, fence or idempotency conflict)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/leases/heartbeat:
    post:
      summary: Six-identity lease renewal (spec 26.4); zero rows is stale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseHeartbeatRequest"
      responses:
        "204":
          description: lease renewed
        "409":
          description: stale authority (zero matched rows)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/leases/release:
    post:
      summary: Close a lease with a terminal attempt state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseReleaseRequest"
      responses:
        "204":
          description: released (idempotent for an already-final attempt)
        "404":
          description: unknown attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: lease held by another attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/attempts/advance:
    post:
      summary: Apply one legal attempt state transition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttemptAdvanceRequest"
      responses:
        "204":
          description: transition applied
        "400":
          description: illegal transition or unknown state label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: unknown attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/ready:
    get:
      summary: The next ready work package
      responses:
        "200":
          description: next dispatchable package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyView"
        "404":
          description: ready queue empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
    ObservationKind:
      type: string
      enum: [value, empty, unknown, contradictory]
    Mission:
      type: object
      required:
        - id
        - organization_id
        - repository_id
        - title
        - objective
        - acceptance_contract_id
        - state
      properties:
        id: { type: string }
        organization_id: { type: string }
        repository_id: { type: string }
        title: { type: string }
        objective: { type: string }
        acceptance_contract_id: { type: string }
        state: { type: string }
    WorkPackage:
      type: object
      required:
        - id
        - mission_id
        - plan_revision_id
        - task_class
        - title
        - state
      properties:
        id: { type: string }
        mission_id: { type: string }
        plan_revision_id: { type: string }
        task_class: { type: string }
        title: { type: string }
        state: { type: string }
    MissionView:
      type: object
      required: [mission, packages, fence]
      properties:
        mission:
          $ref: "#/components/schemas/Mission"
        packages:
          type: array
          items:
            $ref: "#/components/schemas/WorkPackage"
        fence:
          type: [integer, "null"]
    DemoReceipt:
      type: object
      required:
        - mission_id
        - plan_hash
        - fence
        - attempt_id
        - fence_second
        - attempt_second_id
        - stale_attempt_id
        - candidate_head
        - evidence_result
        - effect_outcome
        - effect_unknown_outcome
        - materialize_idempotent
        - stale_refused
      properties:
        mission_id: { type: string }
        plan_hash: { type: string }
        fence: { type: integer }
        attempt_id: { type: string }
        fence_second: { type: integer }
        attempt_second_id: { type: string }
        stale_attempt_id: { type: string }
        candidate_head: { type: string }
        evidence_result: { type: string }
        effect_outcome: { type: string }
        effect_unknown_outcome: { type: string }
        materialize_idempotent: { type: boolean }
        stale_refused: { type: boolean }
    OutboxItem:
      type: object
      required: [seq, kind, payload, phase, delivered_at, acked_at]
      properties:
        seq: { type: integer }
        kind: { type: string }
        payload: { type: string }
        phase: { type: string }
        delivered_at:
          type: [string, "null"]
        acked_at:
          type: [string, "null"]
    OutboxView:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OutboxItem"
    Event:
      type: object
      required:
        - seq
        - kind
        - body
        - event_id
        - stream_id
        - sequence
        - causation_id
        - correlation_id
        - authority_token_hash
      properties:
        seq: { type: integer }
        kind: { type: string }
        body: { type: string }
        event_id:
          type: [string, "null"]
        stream_id:
          type: [string, "null"]
        sequence:
          type: [integer, "null"]
        causation_id:
          type: [string, "null"]
        correlation_id:
          type: [string, "null"]
        authority_token_hash:
          type: [string, "null"]
    Problem:
      type: object
      required: [type, title, status, code, correlation_id, retryable]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        correlation_id: { type: string }
        retryable: { type: boolean }
    WorkspaceNonce:
      type: array
      items:
        type: integer
    Attempt:
      type: object
      required:
        - id
        - variant_id
        - work_package_id
        - fence
        - runner_id
        - runner_epoch
        - workspace_id
        - workspace_nonce
        - scope_revision
        - context_revision
        - state
      properties:
        id: { type: string }
        variant_id: { type: string }
        work_package_id: { type: string }
        fence: { type: integer }
        runner_id: { type: string }
        runner_epoch: { type: integer }
        workspace_id: { type: string }
        workspace_nonce:
          $ref: "#/components/schemas/WorkspaceNonce"
        scope_revision: { type: integer }
        context_revision: { type: integer }
        state: { type: string }
    AuthorityToken:
      type: object
      required:
        - organization_id
        - repository_id
        - mission_id
        - acceptance_contract_id
        - plan_revision_id
        - graph_sequence
        - work_package_id
        - selection_group_id
        - variant_id
        - attempt_id
        - attempt_fence
        - runner_id
        - runner_epoch
        - workspace_id
        - workspace_nonce
        - scope_revision
        - context_revision
        - config_snapshot_hash
        - policy_snapshot_hash
        - routing_policy_hash
        - credential_profile_id
        - credential_generation
      properties:
        organization_id: { type: string }
        repository_id: { type: string }
        mission_id: { type: string }
        acceptance_contract_id: { type: string }
        plan_revision_id: { type: string }
        graph_sequence: { type: integer }
        work_package_id: { type: string }
        selection_group_id: { type: string }
        variant_id: { type: string }
        attempt_id: { type: string }
        attempt_fence: { type: integer }
        runner_id: { type: string }
        runner_epoch: { type: integer }
        workspace_id: { type: string }
        workspace_nonce:
          $ref: "#/components/schemas/WorkspaceNonce"
        scope_revision: { type: integer }
        context_revision: { type: integer }
        config_snapshot_hash: { type: string }
        policy_snapshot_hash: { type: string }
        routing_policy_hash: { type: string }
        credential_profile_id:
          type: [string, "null"]
        credential_generation:
          type: [integer, "null"]
    ActiveLease:
      type: object
      required:
        - variant_id
        - attempt_id
        - fence
        - runner_id
        - runner_epoch
        - workspace_nonce
        - heartbeat_at
        - expires_at
      properties:
        variant_id: { type: string }
        attempt_id: { type: string }
        fence: { type: integer }
        runner_id: { type: string }
        runner_epoch: { type: integer }
        workspace_nonce:
          $ref: "#/components/schemas/WorkspaceNonce"
        heartbeat_at: { type: string }
        expires_at: { type: string }
    LeaseAcquireRequest:
      type: object
      required: [work_package_id, runner_id, runner_epoch, idempotency_key]
      properties:
        work_package_id: { type: string }
        runner_id: { type: string }
        runner_epoch: { type: integer }
        idempotency_key: { type: string }
        ttl_seconds: { type: integer }
    LeaseAcquireResponse:
      type: object
      required: [attempt, authority_token, lease]
      properties:
        attempt:
          $ref: "#/components/schemas/Attempt"
        authority_token:
          $ref: "#/components/schemas/AuthorityToken"
        lease:
          $ref: "#/components/schemas/ActiveLease"
    LeaseHeartbeatRequest:
      type: object
      required:
        - variant_id
        - attempt_id
        - fence
        - runner_id
        - runner_epoch
        - workspace_nonce
      properties:
        variant_id: { type: string }
        attempt_id: { type: string }
        fence: { type: integer }
        runner_id: { type: string }
        runner_epoch: { type: integer }
        workspace_nonce:
          $ref: "#/components/schemas/WorkspaceNonce"
        ttl_seconds: { type: integer }
    LeaseReleaseRequest:
      type: object
      required: [attempt_id, outcome]
      properties:
        attempt_id: { type: string }
        outcome: { type: string }
        requeue: { type: boolean }
    AttemptAdvanceRequest:
      type: object
      required: [attempt_id, state]
      properties:
        attempt_id: { type: string }
        state: { type: string }
    ReadyView:
      type: object
      required: [work_package_id, mission_id, variant_id, title, enqueued_at]
      properties:
        work_package_id: { type: string }
        mission_id: { type: string }
        variant_id: { type: string }
        title: { type: string }
        enqueued_at: { type: string }
