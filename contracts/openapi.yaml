openapi: 3.1.0
info:
  title: Bullet Farm Control Plane
  version: 0.1.0
  description: >
    Projection API. The portal is never an authority source. All /api/v1
    GET/HEAD reads require a live browserSession cookie. A supplied Origin
    must match the configured Portal origin; read requests do not require
    CSRF. Operator read responses use Cache-Control: no-store. SSE closes
    when its opening session expires or is revoked; reconnect requires
    current authority. Clients may bind GET/HEAD reads with
    x-bullet-expected-session; a selector differing from the authenticated
    cookie is refused with SESSION_CHANGED before the handler executes.
    Successful reads, handler absence responses, and SSE openings acknowledge
    the authenticated subject in x-bullet-session-id, including downstream
    400/404/410/500 handler responses. The acknowledgement is mandatory after
    successful read authentication. Authentication refusals
    may occur before acknowledgement. Legacy reads without a selector remain
    supported; clients requiring session binding must refuse missing or
    mismatched acknowledgements before consuming data or replaying a command.
    /health and /openapi.yaml are public.
servers:
  - url: http://127.0.0.1:7420
paths:
  /health:
    get:
      summary: Liveness
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /openapi.yaml:
    get:
      summary: This contract
      responses:
        "200":
          description: OpenAPI document
  /api/v1/operator-snapshot:
    get:
      parameters:
        - $ref: "#/components/parameters/ExpectedSession"
      security:
        - browserSession: []
      summary: All durable operator projections from one atomic ledger snapshot
      responses:
        "401":
          description: browser session missing, invalid, expired, or ambiguous
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Supplied Origin is denied or the expected session differs from the authenticated cookie (SESSION_CHANGED).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: One compatible operator view; any corrupt component refuses the whole response
          headers:
            x-bullet-session-id:
              $ref: "#/components/headers/AcknowledgedSession"
            X-Bullet-As-Of-Sequence:
              description: Latest durable event sequence covered by this snapshot.
              required: true
              schema:
                type: integer
                format: uint64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorSnapshot"
        "500":
          description: store failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/missions:
    get:
      parameters:
        - $ref: "#/components/parameters/ExpectedSession"
      security:
        - browserSession: []
      summary: List missions
      responses:
        "401":
          description: browser session missing, invalid, expired, or ambiguous
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Supplied Origin is denied or the expected session differs from the authenticated cookie (SESSION_CHANGED).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: missions
          headers:
            x-bullet-session-id:
              $ref: "#/components/headers/AcknowledgedSession"
            X-Bullet-As-Of-Sequence:
              description: Latest durable event sequence covered by this snapshot.
              required: true
              schema:
                type: integer
                format: uint64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionListSnapshot"
        "500":
          description: store failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/missions/{id}:
    get:
      security:
        - browserSession: []
      summary: Mission graph projection
      parameters:
        - $ref: "#/components/parameters/ExpectedSession"
        - in: path
          name: id
          required: true
          schema:
            $ref: "#/components/schemas/MissionId"
      responses:
        "401":
          description: browser session missing, invalid, expired, or ambiguous
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Supplied Origin is denied or the expected session differs from the authenticated cookie (SESSION_CHANGED).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: mission view
          headers:
            x-bullet-session-id:
              $ref: "#/components/headers/AcknowledgedSession"
            X-Bullet-As-Of-Sequence:
              description: Latest durable event sequence covered by this snapshot.
              required: true
              schema:
                type: integer
                format: uint64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionSnapshot"
        "400":
          description: invalid id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          headers:
            x-bullet-session-id:
              $ref: "#/components/headers/AcknowledgedSession"
          description: missing
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/demo:
    get:
      parameters:
        - $ref: "#/components/parameters/ExpectedSession"
      security:
        - browserSession: []
      summary: Demo receipt re-derived from ledger rows, or null before a run
      responses:
        "401":
          description: browser session missing, invalid, expired, or ambiguous
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Supplied Origin is denied or the expected session differs from the authenticated cookie (SESSION_CHANGED).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: receipt or null
          headers:
            x-bullet-session-id:
              $ref: "#/components/headers/AcknowledgedSession"
            X-Bullet-As-Of-Sequence:
              description: Latest durable event sequence covered by this snapshot.
              required: true
              schema:
                type: integer
                format: uint64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoSnapshot"
  /api/v1/demo/run:
    post:
      deprecated: true
      summary: Removed direct mutation endpoint
      responses:
        "410":
          description: Submit through the authenticated command ledger instead
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/bootstrap:
    post:
      summary: Exchange the one-time local CLI token for a browser session
      parameters:
        - in: header
          name: Origin
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "200":
          description: HttpOnly SameSite session cookie plus session-bound CSRF token
          headers:
            Set-Cookie:
              required: true
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
        "400":
          description: malformed or non-exact body
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: invalid, expired, or replayed bootstrap
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: missing or denied Origin
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/session:
    get:
      parameters:
        - $ref: "#/components/parameters/ExpectedSession"
      summary: Current durable operator session metadata
      description: No bearer, CSRF token or credential digest is returned. Sessions survive restart until expiry, revocation or restore-epoch change.
      security:
        - browserSession: []
      responses:
        "200":
          description: Authenticated session identity and absolute lifetime
          headers:
            x-bullet-session-id:
              $ref: "#/components/headers/AcknowledgedSession"
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorSessionView"
        "401":
          description: missing, invalid, expired, revoked or ambiguous session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Supplied Origin is denied or the expected session differs from the authenticated cookie (SESSION_CHANGED).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: durable authentication store failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/revoke:
    post:
      summary: Revoke only the presented operator session
      description: Requires exact Origin, session cookie and its CSRF token. Revocation is durable and closes streams opened by this session; other sessions remain valid.
      security:
        - browserSession: []
          csrfToken: []
      parameters:
        - in: header
          name: Origin
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeSessionRequest"
      responses:
        "200":
          description: Durable self-revocation acknowledgement, without credentials
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
            Set-Cookie:
              required: true
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevocationView"
        "400":
          description: body is not an exact empty object
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: missing, invalid, expired, revoked or ambiguous session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Origin or CSRF refusal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: durable authentication store failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/commands:
    get:
      summary: Recover the current operator's durable commands without a local cache
      description: >
        One atomic snapshot of owned commands in ascending submitted-event
        sequence. Historical unowned commands are excluded. Pages stop at
        either the requested count or a conservative 7 MiB serialized budget.
        Continue with next_after until null; no row is dropped at a byte cutoff.
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/ExpectedSession"
        - in: query
          name: after
          description: Canonical decimal submitted-event cursor, without leading zeros except zero itself.
          schema: { type: integer, minimum: 0, maximum: 9007199254740991, default: 0 }
        - in: query
          name: limit
          description: Canonical decimal maximum row count; the byte cap may return fewer rows.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Current owned command states from one compatible ledger snapshot
          headers:
            x-bullet-session-id:
              $ref: "#/components/headers/AcknowledgedSession"
            X-Bullet-As-Of-Sequence:
              required: true
              schema: { type: integer, minimum: 0, maximum: 9007199254740991 }
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandDiscoverySnapshot"
        "400":
          description: Unknown, repeated, malformed or out-of-range query parameter
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Missing, invalid, expired or revoked operator session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Supplied Origin is denied or the expected session differs from the authenticated cookie (SESSION_CHANGED).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Corrupt or inconsistent durable command ownership/projection
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      summary: Durably admit a command and return its current phase
      description: >
        Requires the browser session cookie, its CSRF token, and the exact
        configured loopback Origin. New admission records operator ownership
        atomically with command, outbox, audit and admission effects. Exact
        retry returns the original command's current phase without fresh
        authority or quota admission, while verifying its original immutable
        bindings. Historical unowned keys and other-owner keys conflict.
        Fresh run_coding submissions use the closed RunCodingTaskPayload v2
        contract. Acceptance freezes task intent and allocates a server-owned
        tracking identity; it does not issue execution authority. Obsolete
        caller-allocated authority shapes are refused for fresh public commands.
        Exact historical retries retain their original bindings and current phase.
        conversation_message uses ConversationMessagePayload: cursor null starts
        a server-identified conversation, otherwise the exact current cursor
        is required. Its APPLIED receipt confirms only saved human content and
        queued head work, never an assistant response or successful coding.
        HTTP acceptance is never verification.
      security:
        - browserSession: []
          csrfToken: []
      parameters:
        - in: header
          name: Origin
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandEnvelope"
      responses:
        "202":
          description: initial or exact-replay durable command status
          headers:
            X-Bullet-As-Of-Sequence:
              required: true
              schema: { type: integer, minimum: 0, maximum: 9007199254740991 }
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandStatus"
        "400":
          description: malformed or non-exact command
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: browser session missing or invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Origin or CSRF refusal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: idempotency key is bound to another exact request or outside the authenticated operator history
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/commands/{id}:
    get:
      summary: Read the current phase of one owned durable command
      description: >
        Authenticated owner-only atomic command/outbox/claim/audit projection.
        Absent, foreign-owner and historical unowned commands return 404.
        This read performs no reconciliation or mutation.
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/ExpectedSession"
        - in: path
          name: id
          required: true
          schema:
            $ref: "#/components/schemas/CommandId"
      responses:
        "403":
          description: Supplied Origin is denied or the expected session differs from the authenticated cookie (SESSION_CHANGED).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: PENDING, APPLIED, VERIFIED, FAILED, or UNKNOWN durable truth
          headers:
            x-bullet-session-id:
              $ref: "#/components/headers/AcknowledgedSession"
            X-Bullet-As-Of-Sequence:
              required: true
              schema: { type: integer, minimum: 0, maximum: 9007199254740991 }
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandStatus"
        "400":
          description: invalid command id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: browser session missing or invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          headers:
            x-bullet-session-id:
              $ref: "#/components/headers/AcknowledgedSession"
          description: command not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/conversations:
    get:
      summary: Discover the current operator's durable conversations
      description: >
        One authenticated ledger snapshot. Threads have stable creation-event ordering; after is an exclusive creation-event cursor.
        Messages retain their original content. Queued head work is not an
        assistant response. Invalid durable bindings fail closed.
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/ExpectedSession"
        - in: query
          name: after
          description: Canonical decimal cursor, without leading zeros except zero itself.
          schema: { type: integer, minimum: 0, maximum: 9007199254740991, default: 0 }
        - in: query
          name: limit
          description: Canonical decimal maximum row count.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: One atomic owned conversation observation
          headers:
            x-bullet-session-id:
              $ref: "#/components/headers/AcknowledgedSession"
            X-Bullet-As-Of-Sequence:
              required: true
              schema: { type: integer, minimum: 0, maximum: 9007199254740991 }
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationIndexSnapshot"
        "400":
          description: Malformed subject or query
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Missing, invalid, expired or revoked operator session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Supplied Origin is denied or the expected session differs from the authenticated cookie (SESSION_CHANGED).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Corrupt or inconsistent durable conversation bindings
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/conversations/{conversation_id}:
    get:
      summary: Read complete messages and the current owned conversation cursor
      description: >
        One authenticated ledger snapshot. The current cursor is independent of the message page; after is an exclusive message sequence.
        Messages retain their original content. Queued head work is not an
        assistant response. Invalid durable bindings fail closed.
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/ExpectedSession"
        - in: path
          name: conversation_id
          required: true
          schema:
            $ref: "#/components/schemas/ConversationId"
        - in: query
          name: after
          description: Canonical decimal cursor, without leading zeros except zero itself.
          schema: { type: integer, minimum: 0, maximum: 9007199254740991, default: 0 }
        - in: query
          name: limit
          description: Canonical decimal maximum row count.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: One atomic owned conversation observation
          headers:
            x-bullet-session-id:
              $ref: "#/components/headers/AcknowledgedSession"
            X-Bullet-As-Of-Sequence:
              required: true
              schema: { type: integer, minimum: 0, maximum: 9007199254740991 }
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSnapshot"
        "400":
          description: Malformed subject or query
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Missing, invalid, expired or revoked operator session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Supplied Origin is denied or the expected session differs from the authenticated cookie (SESSION_CHANGED).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          headers:
            x-bullet-session-id:
              $ref: "#/components/headers/AcknowledgedSession"
          description: No owned conversation exists for this subject
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Corrupt or inconsistent durable conversation bindings
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/commands/{id}/coding:
    get:
      summary: Read an owned coding task revision and its current queue blockers
      description: >
        Command, accepted task, run tracking and blockers share one read
        transaction. A queued task is requested work, not launch authority.
        Historical commands without a task revision remain available through
        ordinary command discovery; this endpoint does not invent a revision.
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/ExpectedSession"
        - in: path
          name: id
          required: true
          schema:
            $ref: "#/components/schemas/CommandId"
      responses:
        "200":
          description: One atomic coding observation
          headers:
            x-bullet-session-id:
              $ref: "#/components/headers/AcknowledgedSession"
            X-Bullet-As-Of-Sequence:
              required: true
              schema: { type: integer, minimum: 0, maximum: 9007199254740991 }
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodingRunSnapshot"
        "400":
          description: Invalid command subject
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: An admitted operator session is required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Supplied Origin is denied or the expected session differs from the authenticated cookie (SESSION_CHANGED).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          headers:
            x-bullet-session-id:
              $ref: "#/components/headers/AcknowledgedSession"
          description: No owned task-shaped coding command exists for this subject
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Durable coding records are inconsistent
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/outbox:
    get:
      parameters:
        - $ref: "#/components/parameters/ExpectedSession"
      security:
        - browserSession: []
      summary: Outbox rows with real delivery phases
      responses:
        "401":
          description: browser session missing, invalid, expired, or ambiguous
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Supplied Origin is denied or the expected session differs from the authenticated cookie (SESSION_CHANGED).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: outbox rows
          headers:
            x-bullet-session-id:
              $ref: "#/components/headers/AcknowledgedSession"
            X-Bullet-As-Of-Sequence:
              description: Latest durable event sequence covered by this snapshot.
              required: true
              schema:
                type: integer
                format: uint64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxSnapshot"
  /api/v1/events:
    get:
      security:
        - browserSession: []
      summary: Server-sent event stream of ledger events
      description: >
        Emits one default SSE message per ledger event with the ledger sequence
        as the SSE id and an EventEnvelope as data. Resume with either `after`
        or `Last-Event-ID`; supplying both is a typed error. Cursors are exclusive.
        Replay is bounded to 1024 events and unavailable or retained-away cursors
        return a typed 410 before the event stream is opened.
      parameters:
        - $ref: "#/components/parameters/ExpectedSession"
        - in: query
          name: after
          required: false
          schema:
            type: integer
        - in: header
          name: Last-Event-ID
          required: false
          schema:
            type: integer
      responses:
        "401":
          description: browser session missing, invalid, expired, or ambiguous
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Supplied Origin is denied or the expected session differs from the authenticated cookie (SESSION_CHANGED).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          headers:
            x-bullet-session-id:
              $ref: "#/components/headers/AcknowledgedSession"
          description: text/event-stream of Event frames
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/EventEnvelope"
        "400":
          description: malformed or conflicting cursor
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          description: exclusive cursor is unavailable; refresh a snapshot
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/ready:
    get:
      parameters:
        - $ref: "#/components/parameters/ExpectedSession"
      security:
        - browserSession: []
      summary: The next ready work package
      responses:
        "401":
          description: browser session missing, invalid, expired, or ambiguous
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Supplied Origin is denied or the expected session differs from the authenticated cookie (SESSION_CHANGED).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: next dispatchable package
          headers:
            x-bullet-session-id:
              $ref: "#/components/headers/AcknowledgedSession"
            X-Bullet-As-Of-Sequence:
              description: Latest durable event sequence covered by this snapshot.
              required: true
              schema:
                type: integer
                format: uint64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadySnapshot"
  /api/v1/fleet:
    get:
      parameters:
        - $ref: "#/components/parameters/ExpectedSession"
      security:
        - browserSession: []
      summary: Fleet projection (spec 25.5) of active lease rows and the ready queue
      description: >
        One atomic ledger read. Lease liveness is judged against the store's
        own clock returned as authority_time, never against a caller clock. An
        empty list is zero rows verified at as_of_sequence, not health.
      responses:
        "401":
          description: browser session missing, invalid, expired, or ambiguous
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Supplied Origin is denied or the expected session differs from the authenticated cookie (SESSION_CHANGED).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: fleet view
          headers:
            x-bullet-session-id:
              $ref: "#/components/headers/AcknowledgedSession"
            X-Bullet-As-Of-Sequence:
              description: Latest durable event sequence covered by this snapshot.
              required: true
              schema:
                type: integer
                format: uint64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetSnapshot"
        "500":
          description: store failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/sessions:
    get:
      parameters:
        - $ref: "#/components/parameters/ExpectedSession"
      security:
        - browserSession: []
      summary: Session Supervisor projection (spec 25.7) of attempt rows by state
      description: >
        One atomic ledger read of every attempt row, whether an active lease
        names it, and the durable lease events recorded for it. Attempt rows
        carry no timestamps; only durable event times are shown.
      responses:
        "401":
          description: browser session missing, invalid, expired, or ambiguous
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Supplied Origin is denied or the expected session differs from the authenticated cookie (SESSION_CHANGED).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: session supervisor view
          headers:
            x-bullet-session-id:
              $ref: "#/components/headers/AcknowledgedSession"
            X-Bullet-As-Of-Sequence:
              description: Latest durable event sequence covered by this snapshot.
              required: true
              schema:
                type: integer
                format: uint64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSupervisorSnapshot"
        "500":
          description: store failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/context-lineage:
    get:
      parameters:
        - $ref: "#/components/parameters/ExpectedSession"
      security:
        - browserSession: []
      summary: Context Lineage projection (spec 25.8) of immutable initial capsules
      description: >
        One atomic ledger read of exact plan-derived Context Capsule subjects.
        This schema publishes revision-one lineage only; no provider-created,
        compressed, or successor capsule exists in this slice.
      responses:
        "401":
          description: browser session missing, invalid, expired, or ambiguous
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Supplied Origin is denied or the expected session differs from the authenticated cookie (SESSION_CHANGED).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: context lineage view
          headers:
            x-bullet-session-id:
              $ref: "#/components/headers/AcknowledgedSession"
            X-Bullet-As-Of-Sequence:
              description: Latest durable event sequence covered by this snapshot.
              required: true
              schema:
                type: integer
                format: uint64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextLineageSnapshot"
        "500":
          description: store failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/merge-rail:
    get:
      parameters:
        - $ref: "#/components/parameters/ExpectedSession"
      security:
        - browserSession: []
      summary: Merge Rail projection (spec 25.13) of Candidates, effect intents, and receipts
      description: >
        One atomic ledger read. Every effect state in the catalog is counted so
        a zero OUTCOME_UNKNOWN is explicit rather than absent.
      responses:
        "401":
          description: browser session missing, invalid, expired, or ambiguous
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Supplied Origin is denied or the expected session differs from the authenticated cookie (SESSION_CHANGED).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: merge rail view
          headers:
            x-bullet-session-id:
              $ref: "#/components/headers/AcknowledgedSession"
            X-Bullet-As-Of-Sequence:
              description: Latest durable event sequence covered by this snapshot.
              required: true
              schema:
                type: integer
                format: uint64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeRailSnapshot"
        "500":
          description: store failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/quality-lab:
    get:
      parameters:
        - $ref: "#/components/parameters/ExpectedSession"
      security:
        - browserSession: []
      summary: Quality Lab projection (spec 25.14) of evidence rows with typed outcomes
      description: >
        One atomic ledger read. A stored result outside the outcome catalog
        projects as UNKNOWN and never satisfies a requirement.
      responses:
        "401":
          description: browser session missing, invalid, expired, or ambiguous
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Supplied Origin is denied or the expected session differs from the authenticated cookie (SESSION_CHANGED).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: quality lab view
          headers:
            x-bullet-session-id:
              $ref: "#/components/headers/AcknowledgedSession"
            X-Bullet-As-Of-Sequence:
              description: Latest durable event sequence covered by this snapshot.
              required: true
              schema:
                type: integer
                format: uint64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityLabSnapshot"
        "500":
          description: store failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/audit:
    get:
      parameters:
        - $ref: "#/components/parameters/ExpectedSession"
      security:
        - browserSession: []
      summary: Incidents and Audit projection (spec 25.15) of the bounded durable event tail
      description: >
        One atomic ledger read of the newest events up to tail_window, each
        passing the same envelope integrity check as /api/v1/events. A gap or a
        corrupt row inside the tail is a store failure, never a shorter list.
      responses:
        "401":
          description: browser session missing, invalid, expired, or ambiguous
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Supplied Origin is denied or the expected session differs from the authenticated cookie (SESSION_CHANGED).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: audit view
          headers:
            x-bullet-session-id:
              $ref: "#/components/headers/AcknowledgedSession"
            X-Bullet-As-Of-Sequence:
              description: Latest durable event sequence covered by this snapshot.
              required: true
              schema:
                type: integer
                format: uint64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditSnapshot"
        "500":
          description: store failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  parameters:
    ExpectedSession:
      name: x-bullet-expected-session
      in: header
      required: false
      description: Exact selected session; mismatch with the authenticated cookie refuses before reading data.
      schema:
        type: string
        pattern: '^sid_[0-9a-f]{64}$'
  headers:
    AcknowledgedSession:
      required: true
      description: Authenticated session used for this read; validate before consuming data or treating absence as permission to replay.
      schema:
        type: string
        pattern: '^sid_[0-9a-f]{64}$'
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: bullet_session
    csrfToken:
      type: apiKey
      in: header
      name: X-Bullet-CSRF
  schemas:
    CommandId:
      type: string
      pattern: '^cmd_[0-9a-f]{64}$'
    MissionId:
      type: string
      pattern: '^mis_[0-9a-f]{64}$'
    OrganizationId:
      type: string
      pattern: '^org_[0-9a-f]{64}$'
    RepositoryId:
      type: string
      pattern: '^rep_[0-9a-f]{64}$'
    AcceptanceContractId:
      type: string
      pattern: '^acc_[0-9a-f]{64}$'
    WorkPackageId:
      type: string
      pattern: '^wpk_[0-9a-f]{64}$'
    PlanRevisionId:
      type: string
      pattern: '^pln_[0-9a-f]{64}$'
    VariantId:
      type: string
      pattern: '^var_[0-9a-f]{64}$'
    Digest:
      type: string
      pattern: '^[0-9a-f]{64}$'
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
        portal:
          type: string
          pattern: '^blake3:[0-9a-f]{64}$'
        reap:
          $ref: "#/components/schemas/HealthReap"
    HealthReap:
      type: object
      additionalProperties: false
      required: [last_run_at, reclaimed]
      properties:
        last_run_at: { type: string, format: date-time }
        reclaimed: { type: integer, minimum: 0, maximum: 9007199254740991 }
    BootstrapRequest:
      type: object
      additionalProperties: false
      required: [bootstrap_token]
      properties:
        bootstrap_token: { type: string }
    BootstrapResponse:
      type: object
      additionalProperties: false
      required: [status, csrf_token, expires_in_seconds]
      properties:
        status: { type: string, enum: [AUTHENTICATED] }
        csrf_token:
          type: string
          pattern: '^csrf_[0-9a-f]{64}$'
        expires_in_seconds: { type: integer, minimum: 1, maximum: 9007199254740991 }
    OperatorSessionView:
      type: object
      additionalProperties: false
      required: [status, operator_id, session_id, issued_at, expires_at]
      properties:
        status: { type: string, enum: [AUTHENTICATED] }
        operator_id: { type: string, pattern: '^opr_[0-9a-f]{64}$' }
        session_id: { type: string, pattern: '^sid_[0-9a-f]{64}$' }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    SessionRevocationView:
      type: object
      additionalProperties: false
      required: [status, operator_id, session_id, revoked_at]
      properties:
        status: { type: string, enum: [REVOKED] }
        operator_id: { type: string, pattern: '^opr_[0-9a-f]{64}$' }
        session_id: { type: string, pattern: '^sid_[0-9a-f]{64}$' }
        revoked_at: { type: string, format: date-time }
    RevokeSessionRequest:
      type: object
      additionalProperties: false
      properties: {}
    CommandDiscoveryView:
      type: object
      additionalProperties: false
      required: [commands, next_after]
      properties:
        commands:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CommandStatus"
        next_after:
          type: [integer, "null"]
          minimum: 1
          maximum: 9007199254740991
    CommandDiscoverySnapshot:
      type: object
      additionalProperties: false
      required: [data, as_of_sequence, observed_at, source]
      properties:
        data:
          $ref: "#/components/schemas/CommandDiscoveryView"
        as_of_sequence: { type: integer, minimum: 0, maximum: 9007199254740991 }
        observed_at: { type: string, format: date-time }
        source: { type: string, const: "bullet-kernel/sqlite-ledger" }
    CommandEnvelope:
      type: object
      additionalProperties: false
      required: [idempotency_key, kind, payload]
      properties:
        idempotency_key: { type: string }
        kind: { type: string }
        payload:
          type: object
          properties: {}
    ConversationId:
      type: string
      pattern: "^cnv_[0-9a-f]{64}$"
    ConversationMessageId:
      type: string
      pattern: "^msg_[0-9a-f]{64}$"
    ConversationHeadTurnId:
      type: string
      pattern: "^hdt_[0-9a-f]{64}$"
    ConversationCursor:
      type: object
      additionalProperties: false
      required: [conversation_id, message_id, sequence]
      properties:
        conversation_id:
          $ref: "#/components/schemas/ConversationId"
        message_id:
          $ref: "#/components/schemas/ConversationMessageId"
        sequence: { type: integer, minimum: 1, maximum: 9007199254740991 }
    ConversationMessagePayload:
      type: object
      additionalProperties: false
      description: >
        Payload for conversation_message at the common command ingress. Cursor
        is required and nullable; null starts a thread. Content is preserved
        exactly and additionally limited to 32768 UTF-8 bytes. Whitespace-only
        messages and controls other than tab and newline are rejected.
      required: [schema_version, cursor, content]
      properties:
        schema_version: { type: string, const: "bullet.conversation-message.v1" }
        cursor:
          oneOf:
            - $ref: "#/components/schemas/ConversationCursor"
            - type: "null"
        content: { type: string, minLength: 1, maxLength: 32768 }
    ConversationMessageReceipt:
      type: object
      additionalProperties: false
      required: [schema_version, cursor, content_digest, head_turn_id]
      properties:
        schema_version: { type: string, const: "bullet.conversation-message-receipt.v1" }
        cursor:
          $ref: "#/components/schemas/ConversationCursor"
        content_digest:
          $ref: "#/components/schemas/Digest"
        head_turn_id:
          $ref: "#/components/schemas/ConversationHeadTurnId"
    ConversationMessage:
      type: object
      additionalProperties: false
      description: Assistant authorship requires a validated native outcome.
      required: [cursor, parent_message_id, role, content, content_digest, command_id, head_turn_id, accepted_at]
      properties:
        cursor:
          $ref: "#/components/schemas/ConversationCursor"
        parent_message_id:
          oneOf:
            - $ref: "#/components/schemas/ConversationMessageId"
            - type: "null"
        role: { type: string, enum: [user, assistant] }
        content: { type: string, minLength: 1, maxLength: 32768 }
        content_digest:
          $ref: "#/components/schemas/Digest"
        command_id:
          oneOf:
            - $ref: "#/components/schemas/CommandId"
            - type: "null"
        head_turn_id:
          $ref: "#/components/schemas/ConversationHeadTurnId"
        accepted_at: { type: string, format: date-time }
    ConversationView:
      type: object
      additionalProperties: false
      required: [cursor, messages, next_after, head_blocker]
      properties:
        cursor:
          $ref: "#/components/schemas/ConversationCursor"
        messages:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ConversationMessage"
        next_after:
          type: [integer, "null"]
          minimum: 1
          maximum: 9007199254740991
        head_blocker: { type: string, minLength: 1, maxLength: 96, pattern: "^HEAD_[A-Z_]+$" }
    ConversationSummary:
      type: object
      additionalProperties: false
      required: [cursor, preview, created_at, last_activity_at]
      properties:
        cursor:
          $ref: "#/components/schemas/ConversationCursor"
        preview: { type: string, maxLength: 80 }
        created_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }
    ConversationIndexView:
      type: object
      additionalProperties: false
      required: [conversations, next_after]
      properties:
        conversations:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ConversationSummary"
        next_after:
          type: [integer, "null"]
          minimum: 1
          maximum: 9007199254740991
    ConversationSnapshot:
      type: object
      additionalProperties: false
      required: [data, as_of_sequence, observed_at, source]
      properties:
        data:
          $ref: "#/components/schemas/ConversationView"
        as_of_sequence: { type: integer, minimum: 0, maximum: 9007199254740991 }
        observed_at: { type: string, format: date-time }
        source: { type: string, const: "bullet-kernel/sqlite-ledger" }
    ConversationIndexSnapshot:
      type: object
      additionalProperties: false
      required: [data, as_of_sequence, observed_at, source]
      properties:
        data:
          $ref: "#/components/schemas/ConversationIndexView"
        as_of_sequence: { type: integer, minimum: 0, maximum: 9007199254740991 }
        observed_at: { type: string, format: date-time }
        source: { type: string, const: "bullet-kernel/sqlite-ledger" }
    CodingTaskRevisionId:
      type: string
      pattern: "^ctr_[0-9a-f]{64}$"
    CodingRunId:
      type: string
      pattern: "^crn_[0-9a-f]{64}$"
    CodingTaskBudget:
      type: object
      additionalProperties: false
      required: [max_invocations, max_cost_microusd]
      properties:
        max_invocations: { type: integer, minimum: 1, maximum: 16 }
        max_cost_microusd: { type: integer, minimum: 1, maximum: 1000000000 }
    CodingTaskContract:
      type: object
      additionalProperties: false
      description: >
        Immutable requested work. String bounds are additionally enforced in
        UTF-8 bytes by admission. Paths must be normalized repository-relative
        paths; dependencies name previously accepted revisions owned by this
        operator. Repository identity is a selector, not a grant to access it.
      required: [title, objective, repository_id, base_commit, scope_paths, acceptance_criteria, gate_ids, dependencies, budget, deadline_unix_ms]
      properties:
        title: { type: string, minLength: 1, maxLength: 240 }
        objective: { type: string, minLength: 1, maxLength: 8192 }
        repository_id:
          $ref: "#/components/schemas/RepositoryId"
        base_commit: { type: string, pattern: "^([0-9a-f]{40}|[0-9a-f]{64})$" }
        scope_paths:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 512 }
        acceptance_criteria:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 1024 }
        gate_ids:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items: { type: string, pattern: "^gat_[0-9a-f]{64}$" }
        dependencies:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CodingTaskRevisionId"
        budget:
          $ref: "#/components/schemas/CodingTaskBudget"
        deadline_unix_ms: { type: integer, minimum: 1, maximum: 9007199254740991 }
    CodingRuntimeSelection:
      type: object
      additionalProperties: false
      required: [account_id, provider, model, effort]
      properties:
        account_id: { type: string, minLength: 1, maxLength: 64 }
        provider: { type: string, enum: [claude, codex, cursor, antigravity] }
        model: { type: string, minLength: 1, maxLength: 128 }
        effort: { type: [string, "null"], minLength: 1, maxLength: 32 }
    RunCodingTaskPayload:
      type: object
      additionalProperties: false
      required: [schema_version, task, selection]
      properties:
        schema_version: { type: string, const: "bullet.run-coding.v2" }
        task:
          $ref: "#/components/schemas/CodingTaskContract"
        selection:
          $ref: "#/components/schemas/CodingRuntimeSelection"
    CodingQueueBlocker:
      type: object
      additionalProperties: false
      required: [code, subject]
      properties:
        code: { type: string, minLength: 1, maxLength: 96, pattern: "^CODING_[A-Z_]+$" }
        subject: { type: [string, "null"], maxLength: 256 }
    CodingRunView:
      type: object
      additionalProperties: false
      required: [command, run_id, task_revision_id, task, selection, accepted_at, blockers]
      properties:
        command:
          $ref: "#/components/schemas/CommandStatus"
        run_id:
          $ref: "#/components/schemas/CodingRunId"
        task_revision_id:
          $ref: "#/components/schemas/CodingTaskRevisionId"
        task:
          $ref: "#/components/schemas/CodingTaskContract"
        selection:
          $ref: "#/components/schemas/CodingRuntimeSelection"
        accepted_at: { type: string, format: date-time }
        blockers:
          type: array
          maxItems: 80
          items:
            $ref: "#/components/schemas/CodingQueueBlocker"
    CodingRunSnapshot:
      type: object
      additionalProperties: false
      required: [data, as_of_sequence, observed_at, source]
      properties:
        data:
          $ref: "#/components/schemas/CodingRunView"
        as_of_sequence: { type: integer, minimum: 0, maximum: 9007199254740991 }
        observed_at: { type: string, format: date-time }
        source: { type: string, const: "bullet-kernel/sqlite-ledger" }
    CommandStatus:
      type: object
      additionalProperties: false
      required: [id, status, kind, payload_digest, result]
      properties:
        id:
          $ref: "#/components/schemas/CommandId"
        status:
          type: string
          enum: [PENDING, APPLIED, VERIFIED, FAILED, UNKNOWN]
        kind: { type: string }
        payload_digest:
          $ref: "#/components/schemas/Digest"
        result:
          $ref: "#/components/schemas/JsonValue"
    JsonValue:
      description: A recursively typed JSON value from durable command truth.
      oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: "null"
        - type: array
          items:
            $ref: "#/components/schemas/JsonValue"
        - type: object
          properties: {}
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
    ObservationKind:
      type: string
      enum: [value, empty, unknown, contradictory]
    Mission:
      type: object
      additionalProperties: false
      required:
        - id
        - organization_id
        - repository_id
        - title
        - objective
        - acceptance_contract_id
        - state
      properties:
        id:
          $ref: "#/components/schemas/MissionId"
        organization_id:
          $ref: "#/components/schemas/OrganizationId"
        repository_id:
          $ref: "#/components/schemas/RepositoryId"
        title: { type: string }
        objective: { type: string }
        acceptance_contract_id:
          $ref: "#/components/schemas/AcceptanceContractId"
        state: { type: string }
    WorkPackage:
      type: object
      additionalProperties: false
      required:
        - id
        - mission_id
        - plan_revision_id
        - task_class
        - title
        - state
      properties:
        id:
          $ref: "#/components/schemas/WorkPackageId"
        mission_id:
          $ref: "#/components/schemas/MissionId"
        plan_revision_id:
          $ref: "#/components/schemas/PlanRevisionId"
        task_class: { type: string }
        title: { type: string }
        state: { type: string }
    MissionView:
      type: object
      additionalProperties: false
      required: [mission, packages, fence]
      properties:
        mission:
          $ref: "#/components/schemas/Mission"
        packages:
          type: array
          items:
            $ref: "#/components/schemas/WorkPackage"
        fence:
          type: [integer, "null"]
          minimum: 0
    OperatorSnapshotView:
      type: object
      additionalProperties: false
      required: [missions, graphs, outbox, ready, fleet, sessions, context_lineage, merge_rail, quality_lab, audit]
      properties:
        missions:
          type: array
          items:
            $ref: "#/components/schemas/Mission"
        graphs:
