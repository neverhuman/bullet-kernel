openapi: 3.1.0
info:
  title: Bullet Farm Control Plane
  version: 0.1.0
  description: Projection API. The portal is never an authority source.
servers:
  - url: http://127.0.0.1:7420
paths:
  /health:
    get:
      summary: Liveness
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /openapi.yaml:
    get:
      summary: This contract
      responses:
        "200":
          description: OpenAPI document
  /api/v1/missions:
    get:
      summary: List missions
      responses:
        "200":
          description: missions
          headers:
            X-Bullet-As-Of-Sequence:
              description: Latest durable event sequence covered by this snapshot.
              required: true
              schema:
                type: integer
                format: uint64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionListSnapshot"
        "500":
          description: store failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/missions/{id}:
    get:
      summary: Mission graph projection
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: "#/components/schemas/MissionId"
      responses:
        "200":
          description: mission view
          headers:
            X-Bullet-As-Of-Sequence:
              description: Latest durable event sequence covered by this snapshot.
              required: true
              schema:
                type: integer
                format: uint64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionSnapshot"
        "400":
          description: invalid id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: missing
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/demo:
    get:
      summary: Demo receipt re-derived from ledger rows, or null before a run
      responses:
        "200":
          description: receipt or null
          headers:
            X-Bullet-As-Of-Sequence:
              description: Latest durable event sequence covered by this snapshot.
              required: true
              schema:
                type: integer
                format: uint64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoSnapshot"
  /api/v1/demo/run:
    post:
      deprecated: true
      summary: Removed direct mutation endpoint
      responses:
        "410":
          description: Submit through the authenticated command ledger instead
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/bootstrap:
    post:
      summary: Exchange the one-time local CLI token for a browser session
      parameters:
        - in: header
          name: Origin
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "200":
          description: HttpOnly SameSite session cookie plus session-bound CSRF token
          headers:
            Set-Cookie:
              required: true
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
        "400":
          description: malformed or non-exact body
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: invalid, expired, or replayed bootstrap
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: missing or denied Origin
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/commands:
    post:
      summary: Durably admit a command as pending
      description: >
        Requires the browser session cookie, its CSRF token, and the exact
        configured loopback Origin. HTTP acceptance is never verification.
      security:
        - browserSession: []
          csrfToken: []
      parameters:
        - in: header
          name: Origin
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandEnvelope"
      responses:
        "202":
          description: initial or exact-replay durable command status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandStatus"
        "400":
          description: malformed or non-exact command
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: browser session missing or invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Origin or CSRF refusal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: idempotency key is bound to another exact request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/commands/{id}:
    get:
      summary: Reconcile one durable command
      security:
        - browserSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: "#/components/schemas/CommandId"
      responses:
        "200":
          description: PENDING, APPLIED, VERIFIED, FAILED, or UNKNOWN durable truth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandStatus"
        "400":
          description: invalid command id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: browser session missing or invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: command not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/outbox:
    get:
      summary: Outbox rows with real delivery phases
      responses:
        "200":
          description: outbox rows
          headers:
            X-Bullet-As-Of-Sequence:
              description: Latest durable event sequence covered by this snapshot.
              required: true
              schema:
                type: integer
                format: uint64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxSnapshot"
  /api/v1/events:
    get:
      summary: Server-sent event stream of ledger events
      description: >
        Emits one default SSE message per ledger event with the ledger sequence
        as the SSE id and an EventEnvelope as data. Resume with either `after`
        or `Last-Event-ID`; supplying both is a typed error. Cursors are exclusive.
        Replay is bounded to 1024 events and unavailable or retained-away cursors
        return a typed 410 before the event stream is opened.
      parameters:
        - in: query
          name: after
          required: false
          schema:
            type: integer
        - in: header
          name: Last-Event-ID
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: text/event-stream of Event frames
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/EventEnvelope"
        "400":
          description: malformed or conflicting cursor
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          description: exclusive cursor is unavailable; refresh a snapshot
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/ready:
    get:
      summary: The next ready work package
      responses:
        "200":
          description: next dispatchable package
          headers:
            X-Bullet-As-Of-Sequence:
              description: Latest durable event sequence covered by this snapshot.
              required: true
              schema:
                type: integer
                format: uint64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadySnapshot"
  /api/v1/fleet:
    get:
      summary: Fleet projection (spec 25.5) of active lease rows and the ready queue
      description: >
        One atomic ledger read. Lease liveness is judged against the store's
        own clock returned as authority_time, never against a caller clock. An
        empty list is zero rows verified at as_of_sequence, not health.
      responses:
        "200":
          description: fleet view
          headers:
            X-Bullet-As-Of-Sequence:
              description: Latest durable event sequence covered by this snapshot.
              required: true
              schema:
                type: integer
                format: uint64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetSnapshot"
        "500":
          description: store failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/sessions:
    get:
      summary: Session Supervisor projection (spec 25.7) of attempt rows by state
      description: >
        One atomic ledger read of every attempt row, whether an active lease
        names it, and the durable lease events recorded for it. Attempt rows
        carry no timestamps; only durable event times are shown.
      responses:
        "200":
          description: session supervisor view
          headers:
            X-Bullet-As-Of-Sequence:
              description: Latest durable event sequence covered by this snapshot.
              required: true
              schema:
                type: integer
                format: uint64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSupervisorSnapshot"
        "500":
          description: store failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/context-lineage:
    get:
      summary: Context Lineage projection (spec 25.8) of immutable initial capsules
      description: >
        One atomic ledger read of exact plan-derived Context Capsule subjects.
        This schema publishes revision-one lineage only; no provider-created,
        compressed, or successor capsule exists in this slice.
      responses:
        "200":
          description: context lineage view
          headers:
            X-Bullet-As-Of-Sequence:
              description: Latest durable event sequence covered by this snapshot.
              required: true
              schema:
                type: integer
                format: uint64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextLineageSnapshot"
        "500":
          description: store failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/merge-rail:
    get:
      summary: Merge Rail projection (spec 25.13) of Candidates, effect intents, and receipts
      description: >
        One atomic ledger read. Every effect state in the catalog is counted so
        a zero OUTCOME_UNKNOWN is explicit rather than absent.
      responses:
        "200":
          description: merge rail view
          headers:
            X-Bullet-As-Of-Sequence:
              description: Latest durable event sequence covered by this snapshot.
              required: true
              schema:
                type: integer
                format: uint64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeRailSnapshot"
        "500":
          description: store failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/quality-lab:
    get:
      summary: Quality Lab projection (spec 25.14) of evidence rows with typed outcomes
      description: >
        One atomic ledger read. A stored result outside the outcome catalog
        projects as UNKNOWN and never satisfies a requirement.
      responses:
        "200":
          description: quality lab view
          headers:
            X-Bullet-As-Of-Sequence:
              description: Latest durable event sequence covered by this snapshot.
              required: true
              schema:
                type: integer
                format: uint64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityLabSnapshot"
        "500":
          description: store failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/audit:
    get:
      summary: Incidents and Audit projection (spec 25.15) of the bounded durable event tail
      description: >
        One atomic ledger read of the newest events up to tail_window, each
        passing the same envelope integrity check as /api/v1/events. A gap or a
        corrupt row inside the tail is a store failure, never a shorter list.
      responses:
        "200":
          description: audit view
          headers:
            X-Bullet-As-Of-Sequence:
              description: Latest durable event sequence covered by this snapshot.
              required: true
              schema:
                type: integer
                format: uint64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditSnapshot"
        "500":
          description: store failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: bullet_session
    csrfToken:
      type: apiKey
      in: header
      name: X-Bullet-CSRF
  schemas:
    CommandId:
      type: string
      pattern: '^cmd_[0-9a-f]{64}$'
    MissionId:
      type: string
      pattern: '^mis_[0-9a-f]{64}$'
    OrganizationId:
      type: string
      pattern: '^org_[0-9a-f]{64}$'
    RepositoryId:
      type: string
      pattern: '^rep_[0-9a-f]{64}$'
    AcceptanceContractId:
      type: string
      pattern: '^acc_[0-9a-f]{64}$'
    WorkPackageId:
      type: string
      pattern: '^wpk_[0-9a-f]{64}$'
    PlanRevisionId:
      type: string
      pattern: '^pln_[0-9a-f]{64}$'
    VariantId:
      type: string
      pattern: '^var_[0-9a-f]{64}$'
    Digest:
      type: string
      pattern: '^[0-9a-f]{64}$'
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
        portal:
          type: string
          pattern: '^blake3:[0-9a-f]{64}$'
        reap:
          $ref: "#/components/schemas/HealthReap"
    HealthReap:
      type: object
      additionalProperties: false
      required: [last_run_at, reclaimed]
      properties:
        last_run_at: { type: string, format: date-time }
        reclaimed: { type: integer, minimum: 0, maximum: 9007199254740991 }
    BootstrapRequest:
      type: object
      additionalProperties: false
      required: [bootstrap_token]
      properties:
        bootstrap_token: { type: string }
    BootstrapResponse:
      type: object
      additionalProperties: false
      required: [status, csrf_token, expires_in_seconds]
      properties:
        status: { type: string, enum: [AUTHENTICATED] }
        csrf_token:
          type: string
          pattern: '^csrf_[0-9a-f]{64}$'
        expires_in_seconds: { type: integer, minimum: 1, maximum: 9007199254740991 }
    CommandEnvelope:
      type: object
      additionalProperties: false
      required: [idempotency_key, kind, payload]
      properties:
        idempotency_key: { type: string }
        kind: { type: string }
        payload:
          type: object
          properties: {}
    CommandStatus:
      type: object
      additionalProperties: false
      required: [id, status, kind, payload_digest, result]
      properties:
        id:
          $ref: "#/components/schemas/CommandId"
        status:
          type: string
          enum: [PENDING, APPLIED, VERIFIED, FAILED, UNKNOWN]
        kind: { type: string }
        payload_digest:
          $ref: "#/components/schemas/Digest"
        result:
          $ref: "#/components/schemas/JsonValue"
    JsonValue:
      description: A recursively typed JSON value from durable command truth.
      oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: "null"
        - type: array
          items:
            $ref: "#/components/schemas/JsonValue"
        - type: object
          properties: {}
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
    ObservationKind:
      type: string
      enum: [value, empty, unknown, contradictory]
    Mission:
      type: object
      additionalProperties: false
      required:
        - id
        - organization_id
        - repository_id
        - title
        - objective
        - acceptance_contract_id
        - state
      properties:
        id:
          $ref: "#/components/schemas/MissionId"
        organization_id:
          $ref: "#/components/schemas/OrganizationId"
        repository_id:
          $ref: "#/components/schemas/RepositoryId"
        title: { type: string }
        objective: { type: string }
        acceptance_contract_id:
          $ref: "#/components/schemas/AcceptanceContractId"
        state: { type: string }
    WorkPackage:
      type: object
      additionalProperties: false
      required:
        - id
        - mission_id
        - plan_revision_id
        - task_class
        - title
        - state
      properties:
        id:
          $ref: "#/components/schemas/WorkPackageId"
        mission_id:
          $ref: "#/components/schemas/MissionId"
        plan_revision_id:
          $ref: "#/components/schemas/PlanRevisionId"
        task_class: { type: string }
        title: { type: string }
        state: { type: string }
    MissionView:
      type: object
      additionalProperties: false
      required: [mission, packages, fence]
      properties:
        mission:
          $ref: "#/components/schemas/Mission"
        packages:
          type: array
          items:
            $ref: "#/components/schemas/WorkPackage"
        fence:
          type: [integer, "null"]
          minimum: 0
    MissionListSnapshot:
      type: object
      additionalProperties: false
      required: [data, as_of_sequence, observed_at, source]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Mission"
        as_of_sequence: { type: integer }
        observed_at: { type: string, format: date-time }
        source: { type: string, enum: [bullet-kernel/sqlite-ledger] }
    MissionSnapshot:
      type: object
      additionalProperties: false
      required: [data, as_of_sequence, observed_at, source]
      properties:
        data:
          $ref: "#/components/schemas/MissionView"
        as_of_sequence: { type: integer }
        observed_at: { type: string, format: date-time }
        source: { type: string, enum: [bullet-kernel/sqlite-ledger] }
    DemoReceipt:
      type: object
      required:
        - mission_id
        - plan_hash
        - fence_first
        - attempt_id
        - fence_second
        - attempt_second_id
        - stale_attempt_id
        - candidate_head
        - evidence_result
        - effect_outcome
        - effect_unknown_outcome
        - materialize_idempotent
        - stale_refused
      properties:
        mission_id: { type: string }
        plan_hash: { type: string }
        fence_first: { type: integer }
        attempt_id: { type: string }
        fence_second: { type: integer }
        attempt_second_id: { type: string }
        stale_attempt_id: { type: string }
        candidate_head: { type: string }
        evidence_result: { type: string }
        effect_outcome: { type: string }
        effect_unknown_outcome: { type: string }
        materialize_idempotent: { type: boolean }
        stale_refused: { type: boolean }
    DemoSnapshot:
      type: object
      additionalProperties: false
      required: [data, as_of_sequence, observed_at, source]
      properties:
        data:
          oneOf:
            - $ref: "#/components/schemas/DemoReceipt"
            - type: "null"
        as_of_sequence: { type: integer }
        observed_at: { type: string, format: date-time }
        source: { type: string, enum: [bullet-kernel/sqlite-ledger] }
    OutboxItem:
      type: object
      additionalProperties: false
      required: [seq, kind, payload, phase, delivered_at, acked_at]
      properties:
        seq: { type: integer, minimum: 1, maximum: 9007199254740991 }
        kind: { type: string, minLength: 1 }
        payload: { type: string }
        phase: { type: string, enum: [pending, applied, failed, verified, unknown] }
        delivered_at:
          type: [string, "null"]
          format: date-time
        acked_at:
          type: [string, "null"]
          format: date-time
    OutboxView:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OutboxItem"
    OutboxSnapshot:
      type: object
      additionalProperties: false
      required: [data, as_of_sequence, observed_at, source]
      properties:
        data:
          $ref: "#/components/schemas/OutboxView"
        as_of_sequence: { type: integer }
        observed_at: { type: string, format: date-time }
        source: { type: string, enum: [bullet-kernel/sqlite-ledger] }
    EventEnvelope:
      type: object
      additionalProperties: false
      required:
        - id
        - seq
        - at
        - kind
        - body
      properties:
        id:
          type: string
          pattern: '^[0-9a-f]{64}$'
        seq: { type: integer, minimum: 1, maximum: 9007199254740991 }
        at: { type: string, format: date-time }
        kind: { type: string, minLength: 1 }
        body: { type: string }
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - request_id
        - correlation_id
        - retryable
        - repair
      properties:
        type:
          type: string
          pattern: '^https://bullet\.farm/problems/[a-z0-9-]+$'
        title: { type: string, minLength: 1 }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, minLength: 1 }
        instance:
          type: string
          pattern: '^urn:bullet:request:req_[0-9a-f]{16}$'
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
        request_id:
          type: string
          pattern: '^req_[0-9a-f]{16}$'
        correlation_id:
          type: string
          pattern: '^corr_[0-9a-f]{16}$'
        retryable: { type: boolean }
        repair: { type: string, minLength: 1 }
    ReadyView:
      type: object
      additionalProperties: false
      required: [work_package_id, mission_id, variant_id, title, enqueued_at]
      properties:
        work_package_id:
          $ref: "#/components/schemas/WorkPackageId"
        mission_id:
          $ref: "#/components/schemas/MissionId"
        variant_id:
          $ref: "#/components/schemas/VariantId"
        title: { type: string }
        enqueued_at: { type: string }
    ReadySnapshot:
      type: object
      additionalProperties: false
      required: [data, as_of_sequence, observed_at, source]
      properties:
        data:
          oneOf:
            - $ref: "#/components/schemas/ReadyView"
            - type: "null"
        as_of_sequence: { type: integer }
        observed_at: { type: string, format: date-time }
        source: { type: string, enum: [bullet-kernel/sqlite-ledger] }
    AttemptId:
      type: string
      pattern: '^atm_[0-9a-f]{64}$'
    RunnerId:
      type: string
      pattern: '^run_[0-9a-f]{64}$'
    WorkspaceId:
      type: string
      pattern: '^wsp_[0-9a-f]{64}$'
    CandidateId:
      type: string
      pattern: '^can_[0-9a-f]{64}$'
    EvidenceId:
      type: string
      pattern: '^evd_[0-9a-f]{64}$'
    EffectId:
      type: string
      pattern: '^efi_[0-9a-f]{64}$'
    EffectReceiptId:
      type: string
      pattern: '^efr_[0-9a-f]{64}$'
    ContextCapsuleId:
      type: string
      pattern: '^ctx_[0-9a-f]{64}$'
    LabelCount:
      description: One catalog label with its row count; zero is explicit, never absent.
      type: object
      additionalProperties: false
      required: [label, count]
      properties:
        label: { type: string }
        count:
          type: integer
          minimum: 0
    ReadyRow:
      type: object
      additionalProperties: false
      required: [work_package_id, enqueued_at]
      properties:
        work_package_id:
          $ref: "#/components/schemas/WorkPackageId"
        enqueued_at: { type: string }
    LeaseLiveness:
      description: Judged against the store clock inside the same snapshot.
      type: string
      enum: [live, expired, unknown]
    FleetLease:
      type: object
      additionalProperties: false
      required:
        - variant_id
        - attempt_id
        - fence
        - runner_id
        - runner_epoch
        - heartbeat_at
        - expires_at
        - ttl_seconds
        - liveness
        - attempt_state
        - work_package_id
        - mission_id
      properties:
        variant_id:
          $ref: "#/components/schemas/VariantId"
        attempt_id:
          $ref: "#/components/schemas/AttemptId"
        fence:
          type: integer
          minimum: 0
        runner_id:
          $ref: "#/components/schemas/RunnerId"
        runner_epoch:
          type: integer
          minimum: 0
        heartbeat_at: { type: string }
