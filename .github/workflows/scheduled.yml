name: scheduled diagnostics

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTUP_AUTO_INSTALL: "0"

jobs:
  source-admission:
    name: source-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install gitleaks 8.21.2
        env:
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.21.2_linux_x64.tar.gz"
          tools="$RUNNER_TEMP/bullet-tools"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$tools"
          tar -xzf "$archive" -C "$tools" gitleaks
          printf '%s\n' "$tools" >>"$GITHUB_PATH"
      - id: lane
        if: ${{ !cancelled() }}
        run: |
          set +e
          bash scripts/ci-local.sh preflight
          code=$?
          set -e
          printf 'exit_code=%s\n' "$code" >>"$GITHUB_OUTPUT"
          exit "$code"
      - if: ${{ always() }}
        env:
          EXIT_CODE: ${{ steps.lane.outputs.exit_code || '1' }}
        run: bash scripts/ci-observation.sh scheduled-preflight "$EXIT_CODE" 'bash scripts/ci-local.sh preflight'
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-scheduled-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/observations/scheduled-preflight.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  links:
    name: external-links
    needs: source-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: lychee@0.24.0
          fallback: none
      - id: lane
        if: ${{ !cancelled() }}
        run: |
          set +e
          bash scripts/ci-local.sh links
          code=$?
          set -e
          printf 'exit_code=%s\n' "$code" >>"$GITHUB_OUTPUT"
          exit "$code"
      - if: ${{ always() }}
        env:
          EXIT_CODE: ${{ steps.lane.outputs.exit_code || '1' }}
        run: bash scripts/ci-observation.sh links "$EXIT_CODE" 'bash scripts/ci-local.sh links'
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-links-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/observations/links.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  advisories:
    name: advisories-and-supply-chain
    needs: source-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # pinned action
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-deny@0.19.8,zizmor@1.25.2
          fallback: none
      - name: Install gitleaks 8.21.2
        env:
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.21.2_linux_x64.tar.gz"
          tools="$RUNNER_TEMP/bullet-tools"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$tools"
          tar -xzf "$archive" -C "$tools" gitleaks
          printf '%s\n' "$tools" >>"$GITHUB_PATH"
      - id: lane
        if: ${{ !cancelled() }}
        run: |
          set +e
          bash scripts/ci-local.sh security
          code=$?
          set -e
          printf 'exit_code=%s\n' "$code" >>"$GITHUB_OUTPUT"
          exit "$code"
      - if: ${{ always() }}
        env:
          EXIT_CODE: ${{ steps.lane.outputs.exit_code || '1' }}
        run: bash scripts/ci-observation.sh scheduled-security "$EXIT_CODE" 'bash scripts/ci-local.sh security'
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-advisories-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/observations/scheduled-security.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: standalone-coverage
    needs: source-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # pinned action
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-nextest@0.9.137,cargo-llvm-cov@0.8.7
          fallback: none
      - id: lane
        if: ${{ !cancelled() }}
        run: |
          set +e
          bash scripts/ci-local.sh coverage
          code=$?
          set -e
          printf 'exit_code=%s\n' "$code" >>"$GITHUB_OUTPUT"
          exit "$code"
      - if: ${{ always() }}
        env:
          EXIT_CODE: ${{ steps.lane.outputs.exit_code || '1' }}
        run: |
          artifacts=()
          [[ -f .ci-artifacts/coverage/summary.json ]] && artifacts+=(.ci-artifacts/coverage/summary.json)
          bash scripts/ci-observation.sh coverage "$EXIT_CODE" 'bash scripts/ci-local.sh coverage' "${artifacts[@]}"
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-artifacts/observations/coverage.json
            .ci-artifacts/coverage/summary.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  history-secrets:
    name: full-history-secrets
    needs: source-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks 8.21.2
        env:
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.21.2_linux_x64.tar.gz"
          tools="$RUNNER_TEMP/bullet-tools"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$tools"
          tar -xzf "$archive" -C "$tools" gitleaks
          printf '%s\n' "$tools" >>"$GITHUB_PATH"
      - id: lane
        if: ${{ !cancelled() }}
        run: |
          set +e
          bash scripts/ci-local.sh history-secrets
          code=$?
          set -e
          printf 'exit_code=%s\n' "$code" >>"$GITHUB_OUTPUT"
          exit "$code"
      - if: ${{ always() }}
        env:
          EXIT_CODE: ${{ steps.lane.outputs.exit_code || '1' }}
        run: bash scripts/ci-observation.sh history-secrets "$EXIT_CODE" 'bash scripts/ci-local.sh history-secrets'
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-history-secrets-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/observations/history-secrets.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  portable-refusal:
    name: portable-refusal-${{ matrix.os }}
    needs: source-admission
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # pinned action
        with:
          toolchain: 1.97.1
      - id: lane
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          bash scripts/ci-local.sh portable-refusal
          code=$?
          set -e
          printf 'exit_code=%s\n' "$code" >>"$GITHUB_OUTPUT"
          exit "$code"
      - if: ${{ always() }}
        shell: bash
        env:
          EXIT_CODE: ${{ steps.lane.outputs.exit_code || '1' }}
        run: bash scripts/ci-observation.sh portable-${{ matrix.os }} "$EXIT_CODE" 'bash scripts/ci-local.sh portable-refusal'
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-portable-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/observations/portable-${{ matrix.os }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  audit:
    name: jankurai-audit
    needs: source-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: lane
        if: ${{ !cancelled() }}
        run: |
          set +e
          bash scripts/ci-local.sh audit
          code=$?
          set -e
          printf 'exit_code=%s\n' "$code" >>"$GITHUB_OUTPUT"
          exit "$code"
      - if: ${{ always() }}
        env:
          EXIT_CODE: ${{ steps.lane.outputs.exit_code || '1' }}
        run: bash scripts/ci-observation.sh audit "$EXIT_CODE" 'bash scripts/ci-local.sh audit'
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/observations/audit.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
