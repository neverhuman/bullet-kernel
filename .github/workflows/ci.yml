name: ci

# Thin workflow. Every job delegates to ops/ci/<lane>.sh so local runs
# (scripts/ci-local.sh <lane>, just <lane>) and hosted CI execute the same
# commands. Required and contract lanes are offline: no live provider, forge,
# or network mutation. Runners must provide cargo-nextest, gitleaks,
# cargo-deny, and jankurai; a missing tool fails the lane instead of skipping.
# Every third-party action is pinned to a full 40-character commit SHA.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast-lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - uses: taiki-e/install-action@9ca1734d8940023f074414ee621fd530c4ce10f2 # v2.62.45
        with:
          tool: cargo-nextest@0.9.137
      - name: Deterministic fast lane
        run: bash ops/ci/fast.sh

  required:
    name: required-lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: fast
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - uses: taiki-e/install-action@9ca1734d8940023f074414ee621fd530c4ce10f2 # v2.62.45
        with:
          tool: cargo-nextest@0.9.137
      - name: Required (fast + clippy)
        run: bash ops/ci/required.sh

  contract:
    name: contract-lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: required
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - uses: taiki-e/install-action@9ca1734d8940023f074414ee621fd530c4ce10f2 # v2.62.45
        with:
          tool: cargo-nextest@0.9.137
      - name: Contract (tapes and simulators only)
        run: bash ops/ci/contract.sh

  security:
    name: security-lane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
      - name: Security (gitleaks + cargo deny bans)
        run: bash ops/ci/security.sh

  audit:
    name: jankurai-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Audit (ratcheted floor)
        run: bash ops/ci/audit.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repo-score
          path: |
            .jankurai/repo-score.json
            .jankurai/repo-score.md
