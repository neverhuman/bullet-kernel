name: ci

# Thin workflow. Every job delegates to ops/ci/<lane>.sh so local runs
# (scripts/ci-local.sh <lane>, just <lane>) and hosted CI execute the same
# commands. Required and contract lanes are offline: no live provider, forge,
# or network mutation. Hosted jobs provision pinned nextest, gitleaks, and
# cargo-deny tools. Jankurai remains a fail-closed local/release gate and is not
# registered here until a portable pinned distribution exists.
# Every third-party action is pinned to a full 40-character commit SHA.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast-lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # pinned action
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - uses: taiki-e/install-action@81ee1d48d9194cdcab880cbdc7d36e87d39874cb # v2.62.45
        with:
          tool: cargo-nextest@0.9.137
          fallback: none
      - name: Deterministic fast lane
        run: bash ops/ci/fast.sh

  required:
    name: required-lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: fast
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # pinned action
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - uses: taiki-e/install-action@81ee1d48d9194cdcab880cbdc7d36e87d39874cb # v2.62.45
        with:
          tool: cargo-nextest@0.9.137
          fallback: none
      - name: Required (fast + clippy)
        run: bash ops/ci/required.sh

  contract:
    name: contract-lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: required
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # pinned action
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - uses: taiki-e/install-action@81ee1d48d9194cdcab880cbdc7d36e87d39874cb # v2.62.45
        with:
          tool: cargo-nextest@0.9.137
          fallback: none
      - name: Contract (tapes and simulators only)
        run: bash ops/ci/contract.sh

  security:
    name: security-lane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # pinned action
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@81ee1d48d9194cdcab880cbdc7d36e87d39874cb # v2.62.45
        with:
          tool: cargo-deny@0.19.8
          fallback: none
      - name: Install gitleaks 8.21.2
        env:
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.21.2_linux_x64.tar.gz"
          tools="$RUNNER_TEMP/bullet-tools"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$tools"
          tar -xzf "$archive" -C "$tools" gitleaks
          printf '%s\n' "$tools" >> "$GITHUB_PATH"
      - name: Security (gitleaks + cargo deny bans)
        run: bash ops/ci/security.sh
