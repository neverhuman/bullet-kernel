name: CI

# GitHub is a secretless public mirror. The five required lanes are independent
# local scripts; this workflow only provisions pinned tools, runs them in
# parallel after source admission, and converges on one stable protected name.

on:
  push:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTUP_AUTO_INSTALL: "0"

jobs:
  preflight:
    name: source-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install gitleaks 8.21.2
        env:
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.21.2_linux_x64.tar.gz"
          tools="$RUNNER_TEMP/bullet-tools"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$tools"
          tar -xzf "$archive" -C "$tools" gitleaks
          printf '%s\n' "$tools" >>"$GITHUB_PATH"
      - id: lane
        if: ${{ !cancelled() }}
        name: Scan source and lockfiles before dependency installation
        run: |
          set +e
          bash scripts/ci-local.sh preflight
          code=$?
          set -e
          printf 'exit_code=%s\n' "$code" >>"$GITHUB_OUTPUT"
          exit "$code"
      - name: Write unsigned diagnostic observation
        if: ${{ always() }}
        env:
          EXIT_CODE: ${{ steps.lane.outputs.exit_code || '1' }}
        run: bash scripts/ci-observation.sh preflight "$EXIT_CODE" 'bash scripts/ci-local.sh preflight'
      - name: Upload sanitized diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/observations/preflight.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  fast:
    name: fast
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # pinned action
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-nextest@0.9.137
          fallback: none
      - id: lane
        if: ${{ !cancelled() }}
        name: Standalone component partition
        run: |
          set +e
          bash scripts/ci-local.sh fast
          code=$?
          set -e
          printf 'exit_code=%s\n' "$code" >>"$GITHUB_OUTPUT"
          exit "$code"
      - name: Write unsigned diagnostic observation
        if: ${{ always() }}
        env:
          EXIT_CODE: ${{ steps.lane.outputs.exit_code || '1' }}
        run: |
          artifacts=()
          [[ -f .ci-artifacts/junit/fast.xml ]] && artifacts+=(.ci-artifacts/junit/fast.xml)
          bash scripts/ci-observation.sh fast "$EXIT_CODE" 'bash scripts/ci-local.sh fast' "${artifacts[@]}"
      - name: Upload sanitized diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-artifacts/observations/fast.json
            .ci-artifacts/junit/fast.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  lint:
    name: lint
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # pinned action
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: actionlint@1.7.8,shellcheck@0.10.0
          fallback: none
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-nextest@0.9.137
          fallback: none
      - id: lane
        if: ${{ !cancelled() }}
        name: Rust and CI policy lint
        run: |
          set +e
          bash scripts/ci-local.sh lint
          code=$?
          set -e
          printf 'exit_code=%s\n' "$code" >>"$GITHUB_OUTPUT"
          exit "$code"
      - name: Write unsigned diagnostic observation
        if: ${{ always() }}
        env:
          EXIT_CODE: ${{ steps.lane.outputs.exit_code || '1' }}
        run: bash scripts/ci-observation.sh lint "$EXIT_CODE" 'bash scripts/ci-local.sh lint'
      - name: Upload sanitized diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-lint-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/observations/lint.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  contract:
    name: contract
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # pinned action
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-nextest@0.9.137
          fallback: none
      - id: lane
        if: ${{ !cancelled() }}
        name: Offline provider contracts and simulation
        run: |
          set +e
          bash scripts/ci-local.sh contract
          code=$?
          set -e
          printf 'exit_code=%s\n' "$code" >>"$GITHUB_OUTPUT"
          exit "$code"
      - name: Write unsigned diagnostic observation
        if: ${{ always() }}
        env:
          EXIT_CODE: ${{ steps.lane.outputs.exit_code || '1' }}
        run: |
          artifacts=()
          [[ -f .ci-artifacts/junit/contract.xml ]] && artifacts+=(.ci-artifacts/junit/contract.xml)
          bash scripts/ci-observation.sh contract "$EXIT_CODE" 'bash scripts/ci-local.sh contract' "${artifacts[@]}"
      - name: Upload sanitized diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-artifacts/observations/contract.json
            .ci-artifacts/junit/contract.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  security:
    name: security
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # pinned action
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-deny@0.19.8,zizmor@1.25.2
          fallback: none
      - name: Install gitleaks 8.21.2
        env:
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.21.2_linux_x64.tar.gz"
          tools="$RUNNER_TEMP/bullet-tools"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$tools"
          tar -xzf "$archive" -C "$tools" gitleaks
          printf '%s\n' "$tools" >>"$GITHUB_PATH"
      - id: lane
        if: ${{ !cancelled() }}
        name: Secrets, advisories, bans, licenses, sources, workflows
        run: |
          set +e
          bash scripts/ci-local.sh security
          code=$?
          set -e
          printf 'exit_code=%s\n' "$code" >>"$GITHUB_OUTPUT"
          exit "$code"
      - name: Write unsigned diagnostic observation
        if: ${{ always() }}
        env:
          EXIT_CODE: ${{ steps.lane.outputs.exit_code || '1' }}
        run: bash scripts/ci-observation.sh security "$EXIT_CODE" 'bash scripts/ci-local.sh security'
      - name: Upload sanitized diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/observations/security.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  docs:
    name: docs
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # pinned action
        with:
          toolchain: 1.97.1
      - id: lane
        if: ${{ !cancelled() }}
        name: Contracts, rustdoc, and relative links
        run: |
          set +e
          bash scripts/ci-local.sh docs
          code=$?
          set -e
          printf 'exit_code=%s\n' "$code" >>"$GITHUB_OUTPUT"
          exit "$code"
      - name: Write unsigned diagnostic observation
        if: ${{ always() }}
        env:
          EXIT_CODE: ${{ steps.lane.outputs.exit_code || '1' }}
        run: bash scripts/ci-observation.sh docs "$EXIT_CODE" 'bash scripts/ci-local.sh docs'
      - name: Upload sanitized diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/observations/docs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  required:
    name: required
    if: ${{ always() }}
    needs: [preflight, fast, lint, contract, security, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_COMMIT: ${{ github.sha }}
      PREFLIGHT_RESULT: ${{ needs.preflight.result }}
      FAST_RESULT: ${{ needs.fast.result }}
      LINT_RESULT: ${{ needs.lint.result }}
      CONTRACT_RESULT: ${{ needs.contract.result }}
      SECURITY_RESULT: ${{ needs.security.result }}
      DOCS_RESULT: ${{ needs.docs.result }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download preflight observation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kernel-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/atomic/observations
      - name: Download fast observation and JUnit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kernel-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/atomic
      - name: Download lint observation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kernel-lint-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/atomic/observations
      - name: Download contract observation and JUnit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kernel-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/atomic
      - name: Download security observation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kernel-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/atomic/observations
      - name: Download docs observation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kernel-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/atomic/observations
      - name: Reject failed, skipped, cancelled, missing, or malformed predecessors
        run: >-
          bash ops/ci/aggregate.sh .ci-artifacts/atomic "$EXPECTED_COMMIT"
          "$PREFLIGHT_RESULT" "$FAST_RESULT" "$LINT_RESULT"
          "$CONTRACT_RESULT" "$SECURITY_RESULT" "$DOCS_RESULT"
