name: nightly

# Live harnesses only. Missing binaries or credentials skip, never fail merge.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: Nightly (skip if unset)
        run: bash scripts/ci-local.sh nightly
        env:
          BULLET_LIVE_HARNESS: ${{ secrets.BULLET_LIVE_HARNESS }}
