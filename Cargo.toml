[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/application",
  "crates/adapters",
  "crates/test-simulation",
  "apps/bullet-farmd",
  "apps/bullet",
  "apps/bullet-runner",
  "apps/bullet-verifier",
  "apps/bullet-effects",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
authors = ["Bullet Farm"]

[workspace.dependencies]
bullet-domain = { path = "crates/domain" }
bullet-application = { path = "crates/application" }
bullet-adapters = { path = "crates/adapters" }
bullet-test-simulation = { path = "crates/test-simulation" }
anyhow = "1"
axum = { version = "0.8", features = ["json", "macros"] }
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
proptest = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "allow", priority = -1 }
